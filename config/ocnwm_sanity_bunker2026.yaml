run_name: ocnwm_sanity_bunker2026

# OCNWM SANITY config (Stage D): a small, from-scratch, few-step run that validates the
# two-stage integration end to end on REAL bunker2026 data + the frozen-VideoSAUR slot cache.
# This is NOT a real training config: small model, no pretrained init, tiny step budget.
# Real finetunes use model: CDiT-XL/2 + from_checkpoint + finetune_mode.

results_dir: logs
batch_size: 2
num_workers: 2
model: CDiT-S/2            # small for a fast sanity; real runs use CDiT-XL/2
lr: 1.0e-4

normalize: True
grad_clip_val: 10.0
context_size: 4
len_traj_pred: 64
image_size: 224

# Matches the precomputed index dataset_dist_-64_to_64_n4_len_traj_pred_64.pkl in the split.
distance:
  min_dist_cat: -64
  max_dist_cat: 64

max_steps: 150            # hard stop for the sanity run

# --- OCNWM slots: A2 full two-stage (Stage-1 predictor + exo cross-attn + L_slot) ---
slot_mode: full           # off (A0) | context (A1) | full (A2)
lambda_slot: 1.0
slot_cache_root: /scratch/workspace/suyoungkang_umass_edu-ocnwm/data/preprocessed/slot_cache/ytvis_dino224_k7
slot_dim: 64
num_slots: 7
slot_gmm_modes: 4
slot_hidden_dim: 256
eps_wta: 0.1
slot_regression: mse

datasets:
  bunker2026:
    data_folder: /scratch/workspace/suyoungkang_umass_edu-ocnwm/data/preprocessed/datasets/bunker2026
    train: /scratch/workspace/suyoungkang_umass_edu-ocnwm/data/preprocessed/data_splits/bunker2026/train
    test: /scratch/workspace/suyoungkang_umass_edu-ocnwm/data/preprocessed/data_splits/bunker2026/test
    goals_per_obs: 4
